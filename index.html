<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Gastos Básica</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>Dividir Gastos</h1>
            <p>Suma tus cuentas y divide por la cantidad de personas de forma local en tu navegador.</p>
        </div>

        <div class="box">
            <div class="form-group" style="margin: 0; display: flex; align-items: center; gap: 10px;">
                <label for="cant_personas" style="margin: 0;">Cantidad de personas:</label>
                <input type="number" id="cant_personas" min="1" max="10" value="1">
            </div>
        </div>

        <div class="box">
            <h2>Agregar Gasto</h2>
            <form id="form-gasto">
                <div class="form-group">
                    <label for="descripcion">Descripción</label>
                    <input type="text" id="descripcion" placeholder="Ej: Luz, Gas, Supermercado..." required
                        autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="monto">Monto ($)</label>
                    <input type="number" id="monto" placeholder="0.00" step="0.01" min="0.01" required>
                </div>
                <button type="submit" class="btn btn-add">Agregar Gasto</button>
            </form>
        </div>

        <div class="box">
            <h2>Planilla de Gastos</h2>
            <table>
                <thead>
                    <tr>
                        <th>Descripción</th>
                        <th>Monto</th>
                        <th style="width: 60px; text-align: center;">Acción</th>
                    </tr>
                </thead>
                <tbody id="tabla-gastos-body">
                </tbody>
            </table>
            <div id="sin-gastos" class="placeholder-text">No hay gastos cargados.</div>
        </div>

        <div class="results">
            <h3>Resultados</h3>
            <div class="results-summary">
                <p>Suma Total: <strong id="total-gastado">$0,00</strong></p>
                <p>Dividido entre: <strong id="personas-elegidas">1</strong> personas</p>
                <p style="font-size: 16px; margin-top: 10px; border-top: 1px solid #c8e6c9; padding-top: 5px;">
                    Monto por Persona: <strong id="cuota-persona" style="color: #2e7d32;">$0,00</strong>
                </p>
            </div>
            <div style="text-align: right; margin-top: 10px;">
                <button id="btn-reset" class="btn btn-danger">Reiniciar Planilla</button>
            </div>
        </div>
    </div>

    <div id="alert-container" class="alert-container"></div>
    <script src="main.js"></script>
</body>

</html>
